<!DOCTYPE html>
<html>
<head>
    <title>Hope for Children Foundation | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<center>

<h1>Hope for Children Foundation</h1>
<h2>Login</h2>

<form onsubmit="login(); return false;">

<label><b>Username</b></label><br>
<input type="text" id="user" required><br><br>

<label><b>Password</b></label><br>
<input type="password" id="pass" required><br><br>

<input type="submit" value="Login">

</form>

<p>
Don't have an account?
<a href="signup.html">Sign Up</a>
</p>

</center>

<script>

function login(){

if(user.value==localStorage.getItem("username") &&
pass.value==localStorage.getItem("password")){

window.location="home.html";

}

else{

alert("Wrong Username or Password");

}

}

</script>

</body>
</html>
